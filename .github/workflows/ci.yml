name: CI

on:
  push:
    branches: [main, experiment/cpp-hotpath]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/base.txt

      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-vie

      - name: Install Python dependencies and native core
        env:
          UVR_NATIVE_STRICT_BUILD: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify native C++ core
        env:
          UVR_NATIVE_CORE: 'cpp'
        run: |
          python - <<'PY'
          from backend.app.native import native_status
          status = native_status()
          print(status)
          assert status["available"] is True
          assert status["backend"] == "cpp"
          PY

      - name: Native parity and microbenchmark
        run: python scripts/benchmark_native_core.py --iterations 3

      - name: Runtime dependency check
        run: python projectctl.py env --check

      - name: Offline smoke test
        env:
          UVR_NATIVE_CORE: 'cpp'
        run: python projectctl.py smoke

      - name: Current CPU test suite
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          UVR_NATIVE_CORE: 'cpp'
        run: |
          # Historical milestone tests below import eval helpers that are not
          # present in the frozen repository. Keep them in source for history,
          # but exclude them from the current CPU gate.
          #
          # The SigLIP tests listed below intentionally load real Hugging Face
          # model/config artifacts. The CPU CI gate is offline and has no model
          # snapshot, so those checks belong to the real-model/GPU validation.
          pytest \
            -m 'not slow and not real_model and not network and not gpu' \
            --ignore=tests/integration/test_m12_quality.py \
            --ignore=tests/integration/test_m13_5_evaluation.py \
            --ignore=tests/integration/test_m14_evaluation.py \
            --ignore=tests/integration/test_faiss_siglip_index_integration.py \
            --ignore=tests/unit/test_m13_5_corpus.py \
            --ignore=tests/unit/test_m22_end_to_end_benchmark.py \
            --deselect=tests/unit/test_gpu_rc2_stabilization.py::test_siglip2_vocab_and_token_invariants \
            --deselect=tests/unit/test_siglip2.py::TestSigLIP2Encoder::test_embedding_dim_property \
            --deselect=tests/unit/test_siglip2.py::TestSigLIP2Encoder::test_clear_cache

  docker:
    name: Docker build gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --pull --tag unified-video-retrieval:cpp-ci .

      - name: Verify image runtime imports and native core
        run: |
          docker run --rm \
            --entrypoint python \
            -e UVR_NATIVE_CORE=cpp \
            unified-video-retrieval:cpp-ci \
            -c "import backend; import backend.app; import faiss; import av; from backend.app.native import native_status; s=native_status(); assert s['available'] and s['backend']=='cpp', s; print('container imports/native core: OK', s)"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/base.txt

      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-vie

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Runtime dependency check
        run: python projectctl.py env --check

      - name: Offline smoke test
        run: python projectctl.py smoke

      - name: Current CPU test suite
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          # Historical milestone tests below import eval helpers that are not
          # present in the frozen repository. Keep them in source for history,
          # but exclude them from the current RC2 CPU gate.
          #
          # The SigLIP tests listed below intentionally load real Hugging Face
          # model/config artifacts. The CPU CI gate is offline and has no model
          # snapshot, so those checks belong to the real-model/GPU validation.
          pytest \
            -m 'not slow and not real_model and not network and not gpu' \
            --ignore=tests/integration/test_m12_quality.py \
            --ignore=tests/integration/test_m13_5_evaluation.py \
            --ignore=tests/integration/test_m14_evaluation.py \
            --ignore=tests/integration/test_faiss_siglip_index_integration.py \
            --ignore=tests/unit/test_m13_5_corpus.py \
            --ignore=tests/unit/test_m22_end_to_end_benchmark.py \
            --deselect=tests/unit/test_gpu_rc2_stabilization.py::test_siglip2_vocab_and_token_invariants \
            --deselect=tests/unit/test_siglip2.py::TestSigLIP2Encoder::test_embedding_dim_property \
            --deselect=tests/unit/test_siglip2.py::TestSigLIP2Encoder::test_clear_cache

  docker:
    name: Docker build gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --pull --tag aic-retrieval:ci .

      - name: Verify image runtime imports
        run: |
          docker run --rm \
            --entrypoint python \
            aic-retrieval:ci \
            -c "import backend; import backend.app; import faiss; import av; print('container imports: OK')"

  l24a-count-eval:
    name: L24a human-vs-system counting evaluation
    if: github.event_name == 'pull_request' && github.head_ref == 'eval/l24a-human-system-counts'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      COMPUTE_DEVICE: cpu
      VISUAL_DEVICE: cpu
      MODEL_CACHE_DIR: ${{ runner.temp }}/models
      HF_HOME: ${{ runner.temp }}/models/huggingface
      TORCH_HOME: ${{ runner.temp }}/models/torch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install L24a evaluation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            unzip \
            curl \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-vie \
            libgl1 \
            libglib2.0-0
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --no-cache-dir -e .
          python -m pip install --no-cache-dir pillow

      - name: Cache active SigLIP2 snapshot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models/huggingface
          key: l24a-siglip2-${{ runner.os }}-${{ hashFiles('backend/app/core/config.py') }}

      - name: Prepare and verify active SigLIP2 model
        run: |
          python projectctl.py models --prepare --visual
          python projectctl.py models --verify-offline --visual

      - name: Download and extract Videos_L24_a
        run: |
          mkdir -p /tmp/l24a/extracted
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output /tmp/l24a/Videos_L24_a.zip \
            'https://aic-data.ledo.io.vn/Videos_L24_a.zip'
          unzip -t /tmp/l24a/Videos_L24_a.zip | tail -n 5
          unzip -q /tmp/l24a/Videos_L24_a.zip -d /tmp/l24a/extracted
          rm -f /tmp/l24a/Videos_L24_a.zip
          echo "video_files=$(find /tmp/l24a/extracted -type f -name '*.mp4' | wc -l)"

      - name: Reproduce frozen human review samples
        run: |
          python scripts/prepare_l24a_review.py \
            /tmp/l24a/extracted \
            artifacts/l24a-human-review
          test "$(find artifacts/l24a-human-review/overview_frames -type f -name '*.jpg' | wc -l)" -eq 688
          test "$(find artifacts/l24a-human-review/detail_frames -type f -name '*.jpg' | wc -l)" -eq 172

      - name: Run CurrentSystem sampled-frame diagnostic
        run: |
          python scripts/evaluate_l24a_counts.py \
            --review-root artifacts/l24a-human-review \
            --ground-truth eval/l24a/human_count_gt.jsonl \
            --output-dir artifacts/l24a-system-comparison \
            --device cpu \
            --batch-size 8
          cat artifacts/l24a-system-comparison/system_comparison.md

      - name: Upload L24a human review and system comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l24a-human-vs-system-count-evaluation
          path: |
            artifacts/l24a-human-review/inventory.csv
            artifacts/l24a-human-review/inventory.json
            artifacts/l24a-system-comparison
          if-no-files-found: warn
          retention-days: 14

services:
  backend:
    image: gianguyen14/aic-retrieval:${RELEASE_TAG:-1.1.0-rc3}
    container_name: aic-retrieval-backend
    restart: unless-stopped
    ports:
      # Bound to localhost by default for security (unauthenticated API)
      - "127.0.0.1:8000:8000"
    environment:
      - VIDEO_PROCESSED_ROOT=/data/processed
      - MODEL_CACHE_DIR=/models
      - SEARCH_BACKEND=${SEARCH_BACKEND:-qwen3_vl}
      - QWEN3_VL_MODEL_DIR=${QWEN3_VL_MODEL_DIR:-}
      - QA_ANSWER_BACKEND=${QA_ANSWER_BACKEND:-remote_llm}
      - QA_ANSWER_URL=${QA_ANSWER_URL:-https://openrouter.ai/api}
      - QA_ANSWER_MODEL=${QA_ANSWER_MODEL:-deepseek/deepseek-v4-flash-0731}
      - QA_ANSWER_API_KEY=${QA_ANSWER_API_KEY:-}
      - QA_ANSWER_MAX_TOKENS=${QA_ANSWER_MAX_TOKENS:-1024}
      - QA_ANSWER_TIMEOUT_SECONDS=${QA_ANSWER_TIMEOUT_SECONDS:-30}
      - QA_ANSWER_REMOTE_TOP_N=${QA_ANSWER_REMOTE_TOP_N:-2}
      - QA_ANSWER_MAX_EVIDENCE_CHARS=${QA_ANSWER_MAX_EVIDENCE_CHARS:-12000}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-1}
      - TRAKE_COHERENCE_MODE=${TRAKE_COHERENCE_MODE:-diagnostic}
    volumes:
      - ${VIDEOS_DIR:-./data/videos}:/data/videos:ro
      - ${PROCESSED_DIR:-./data/processed}:/data/processed:rw
      - ${MODELS_DIR:-./models}:/models:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: gianguyen14/aic-retrieval:${RELEASE_TAG:-1.1.0-rc3}
    container_name: aic-retrieval-worker
    profiles:
      - tools
    environment:
      - VIDEO_PROCESSED_ROOT=/data/processed
      - MODEL_CACHE_DIR=/models
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    volumes:
      - ${VIDEOS_DIR:-./data/videos}:/data/videos:ro
      - ${PROCESSED_DIR:-./data/processed}:/data/processed:rw
      - ${MODELS_DIR:-./models}:/models:rw
    entrypoint: ["python", "projectctl.py"]
    command: ["--help"]

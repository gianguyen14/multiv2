[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-aic-retrieval"
version = "0.1.0"
description = "Unified multimedia retrieval system for AIC 2026"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["backend*"]

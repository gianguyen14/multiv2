# ==============================================================================
# AIC 2026 Multimodal Video Retrieval — Production Compose Stack
# ==============================================================================

services:
  aic:
    build:
      context: .
      dockerfile: Dockerfile
    image: aic:latest
    container_name: aic-service
    restart: unless-stopped
    ports:
      # Bound to localhost by default for security (unauthenticated API)
      - "${AIC_BIND_IP:-127.0.0.1}:${AIC_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - VIDEO_PROCESSED_ROOT=${VIDEO_PROCESSED_ROOT:-/data/processed}
      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR:-/models}
      - SEARCH_ENCODER=${SEARCH_ENCODER:-siglip2}
      - QWEN3_VL_MODEL_DIR=${QWEN3_VL_MODEL_DIR:-}
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface
      - TORCH_HOME=/cache/torch
    volumes:
      # Persistent host volume mounts
      - ${AIC_DATA_DIR:-./data}:/data:rw
      - ${AIC_MODELS_DIR:-./models}:/models:rw
      - ${AIC_CACHE_DIR:-./cache}:/cache:rw
      - ${AIC_LOGS_DIR:-./logs}:/logs:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional CLI helper for running manual pipeline tasks inside container without extra service
  aic-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: aic:latest
    container_name: aic-cli
    profiles:
      - tools
    env_file:
      - path: .env
        required: false
    volumes:
      - ${AIC_DATA_DIR:-./data}:/data:rw
      - ${AIC_MODELS_DIR:-./models}:/models:rw
      - ${AIC_CACHE_DIR:-./cache}:/cache:rw
      - ${AIC_LOGS_DIR:-./logs}:/logs:rw
    entrypoint: ["python", "projectctl.py"]
    command: ["--help"]
